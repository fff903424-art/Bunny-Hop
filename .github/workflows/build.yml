name: Build Bunny Hop

on:
  push:
  workflow_dispatch:

jobs:
  android64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android64 Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: given
          target: Android64

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: BunnyHop-android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
